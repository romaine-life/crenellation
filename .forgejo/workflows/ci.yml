name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref or commit SHA to build and publish; defaults to this revision.
        required: false
        type: string

permissions:
  id-token: write
  contents: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          # Markdown under frontend/ and backend/ ships in the image: Vite copies
          # frontend/public/ (its asset READMEs included) into dist.
          if grep -qE '^(frontend|backend)/' <<< "$files" \
              || grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [ubuntu-latest, upstairspc-linux]
    env:
      FRONTEND_CHECK_COMMAND: npm --prefix frontend run check
    services:
      postgres:
        image: artifacts.home.romaine.life/dockerhub/library/postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
        env:
          POSTGRES_USER: crenellation
          POSTGRES_PASSWORD: crenellation
          POSTGRES_DB: crenellation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crenellation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve requested ref
        if: inputs.git_ref != ''
        env:
          INPUT_REF: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          git fetch --tags origin '+refs/heads/*:refs/remotes/origin/*'
          if git rev-parse --verify "${INPUT_REF}^{commit}" >/dev/null 2>&1; then
            target="${INPUT_REF}^{commit}"
          else
            target="refs/remotes/origin/${INPUT_REF}^{commit}"
          fi
          git checkout --detach "$(git rev-parse --verify "$target")"

      - uses: romaine-life/pipeline-templates/actions/setup-node@main
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Determine frontend check
        id: frontend_check
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
          const read = (ref, path) => git('show', `${ref}:${path}`);
          const workflowPath = '.forgejo/workflows/ci.yml';
          function contract(ref) {
            const workflow = read(ref, workflowPath);
            const versions = [...workflow.matchAll(/^ +node-version: *(.+)$/gm)].map((m) => m[1]);
            if (versions.length !== 1) throw new Error('Unknown Node version configuration');
            const backend = JSON.parse(read(ref, 'backend/package.json'));
            const commands = backend.scripts.test.split('&&').map((s) => s.trim());
            const inherited = commands.filter((s) => /^npm --prefix \.\.\/frontend run check(?: |$)/.test(s));
            if (inherited.length !== 1) throw new Error('Unknown default frontend check command');
            const explicit = workflow.match(/^ +FRONTEND_CHECK_COMMAND: *(.+)$/m);
            if (explicit && !/^ +run: \$FRONTEND_CHECK_COMMAND *$/m.test(workflow)) {
              throw new Error('Unknown workflow frontend check invocation');
            }
            if (!explicit && !/^ +npm test *$/m.test(workflow)) {
              throw new Error('Unknown inherited frontend check invocation');
            }
            const command = explicit ? explicit[1] : inherited[0].replace('../frontend', 'frontend');
            // ROM trial lengths and selection also depend on workflow environment values.
            const env = [...new Set(workflow.split('\n').filter((line) => /^ +[A-Z][A-Z0-9_]*:/.test(line)
              && !/^ +FRONTEND_CHECK_COMMAND:/.test(line)).map((line) => line.trim()))].sort();
            const setup = workflow.match(/^ +(?:- )?uses: .*actions\/setup-node@.+$/m)?.[0].trim();
            if (!setup) throw new Error('Unknown Node setup action');
            return JSON.stringify({ versions, setup, command, inherited: inherited[0].replace('../frontend', 'frontend'), env });
          }
          let run = true;
          try {
            const base = process.env.BASE_SHA;
            if (process.env.EVENT === 'workflow_dispatch' || !base) throw new Error('No event comparison base');
            git('cat-file', '-e', `${base}^{commit}`);
            const changed = git('diff', '--name-only', '-z', base, 'HEAD').split('\0').filter(Boolean);
            const inputs = changed.some((path) => {
              if (/^(frontend|romlab)\//.test(path)) return true;
              if (path === workflowPath) return false; // Compare its execution contract below.
              if (/^(backend|bin|docs|k8s|scripts|tofu|tools|\.github)\//.test(path)) return false;
              if (path === '.forgejo/workflows/tofu.yaml') return false;
              if (/^(CLAUDE|DELIVERY|DISASSEMBLY|README|ROUTINES)\.md$/.test(path)) return false;
              return true; // Root config, locks and unfamiliar inputs require a full check.
            });
            run = inputs || contract(base) !== contract('HEAD');
            console.log(run ? 'Frontend inputs or execution contract changed; run the complete check.'
              : 'Frontend inputs and execution contract are unchanged; reuse their existing test evidence.');
          } catch (error) {
            console.log(`Run the complete frontend check: ${error.message}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`);
          NODE

      - name: Test app
        working-directory: backend
        env:
          DATABASE_URL: postgres://crenellation:crenellation@localhost:5432/crenellation
        run: |
          npm ci
          npm run test:backend

      - name: Check frontend
        if: steps.frontend_check.outputs.run == 'true'
        run: $FRONTEND_CHECK_COMMAND

  image:
    needs: checks
    runs-on: [ubuntu-latest, upstairspc-linux]
    enable-openid-connect: true
    env:
      REGISTRY: romainecr.azurecr.io
      IMAGE: crenellation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve requested ref
        if: inputs.git_ref != ''
        env:
          INPUT_REF: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          git fetch --tags origin '+refs/heads/*:refs/remotes/origin/*'
          if git rev-parse --verify "${INPUT_REF}^{commit}" >/dev/null 2>&1; then
            target="${INPUT_REF}^{commit}"
          else
            target="refs/remotes/origin/${INPUT_REF}^{commit}"
          fi
          git checkout --detach "$(git rev-parse --verify "$target")"

      - uses: romaine-life/pipeline-templates/actions/azure-cli@main

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=artifacts.home.romaine.life/dockerhub/moby/buildkit:buildx-stable-1@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Compute image fingerprint
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          scripts/image-fingerprint.sh --image app --dockerfile Dockerfile --context . \
            --paths 'Dockerfile .dockerignore backend frontend' | tee "$output"
          tag="$(awk -F= '$1 == "proof_tag" { print $2 }' "$output")"
          test -n "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Login to ACR
        run: az acr login --name romainecr

      - name: Check existing image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if az acr repository show-tags --name romainecr --repository "$IMAGE" \
              --query "[?@=='${TAG}'] | [0]" --output tsv | grep -qx "$TAG"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          network: host
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}-build-cache:app
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}-build-cache:app,mode=max', env.REGISTRY, env.IMAGE) || '' }}

      - name: Publish the image tag to prod
        if: github.event_name != 'pull_request' && !inputs.git_ref && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forgejo-actions[bot]'
          git config user.email 'forgejo-actions@romaine.life'
          git fetch origin '+refs/heads/prod:refs/remotes/origin/prod'
          git worktree add --detach prod-deploy origin/prod
          git -C prod-deploy rm -r k8s
          cp -r k8s prod-deploy/k8s
          sed -i "s|^  tag: .*|  tag: \"${TAG}\"|" prod-deploy/k8s/values.yaml
          grep -qx "  tag: \"${TAG}\"" prod-deploy/k8s/values.yaml
          git -C prod-deploy add k8s
          if ! git -C prod-deploy diff --cached --quiet; then
            git -C prod-deploy commit -m "deploy: crenellation image ${TAG}"
            git -C prod-deploy push origin HEAD:prod
          fi
          git worktree remove prod-deploy

      - name: Publish source release
        if: github.event_name != 'pull_request' && !inputs.git_ref && github.ref == 'refs/heads/main'
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          tag="$(git tag --points-at HEAD --list 'v[0-9]*' --sort=-version:refname | head -1)"
          if [ -z "$tag" ]; then
            last="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)"
            if [ -z "$last" ]; then tag=v0.1.0; else
              tag="$(printf '%s' "$last" | awk -F. '{print $1 "." $2 "." ($3+1)}')"
            fi
          fi
          code="$(curl -sS -o /tmp/crenellation-release.json -w '%{http_code}' \
            -H "Authorization: token $TOKEN" "$api/releases/tags/$tag")"
          if [ "$code" = 200 ]; then
            test "$(jq -r .target_commitish /tmp/crenellation-release.json)" = "$GITHUB_SHA"
          elif [ "$code" = 404 ]; then
            jq -n --arg tag "$tag" --arg sha "$GITHUB_SHA" \
              '{tag_name:$tag,target_commitish:$sha,name:$tag,body:"Source release built and tested on Forgejo."}' \
              | curl -fsS -X POST -H "Authorization: token $TOKEN" \
                  -H 'Content-Type: application/json' --data-binary @- "$api/releases" >/dev/null
          else
            echo "Release lookup failed: HTTP $code" >&2
            exit 1
          fi
          echo "Published $tag from $GITHUB_SHA"
